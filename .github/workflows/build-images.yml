name: Build and publish AMIELAR images

on:
  workflow_dispatch:
  push:
    tags:
      - "ghcr-staging-*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: catarb
  APP_IMAGE: ghcr.io/catarb/amielar-app
  MIGRATOR_IMAGE: ghcr.io/catarb/amielar-migrator

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.sha }}
            ${{ env.APP_IMAGE }}:staging
          cache-from: type=gha,scope=amielar-app
          cache-to: type=gha,mode=max,scope=amielar-app

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.MIGRATOR_IMAGE }}:${{ github.sha }}
            ${{ env.MIGRATOR_IMAGE }}:staging
          cache-from: type=gha,scope=amielar-migrator
          cache-to: type=gha,mode=max,scope=amielar-migrator
